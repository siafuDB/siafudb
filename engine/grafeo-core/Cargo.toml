[package]
edition = "2024"
rust-version = "1.99.0"
name = "grafeo-core"
version = "0.6.2"
authors = ["S.T. Grond"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Core graph models, indexes, and execution primitives for Grafeo"
readme = false
license = "Apache-2.0"
repository = "https://github.com/GrafeoDB/grafeo"
resolver = "2"

[features]
compact-store = []
conformance = []
default = [
    "parallel",
    "spill",
    "mmap",
    "regex",
]
hybrid-search = [
    "text-index",
    "vector-index",
]
jsonl-import = ["serde_json"]
lpg = []
mmap = []
parallel = [
    "rayon",
    "crossbeam",
]
parquet-import = ["parquet"]
rdf = ["triple-store"]
ring-index = [
    "succinct-indexes",
    "triple-store",
]
shacl = ["triple-store"]
spill = []
succinct-indexes = []
temporal = []
testing-crash-injection = ["grafeo-common/testing-crash-injection"]
testing-deadline-probe = []
text-index = []
tiered-storage = []
triple-store = []
vector-index = [
    "ordered-float",
    "rand",
]

[lib]
name = "grafeo_core"
path = "src/lib.rs"

[[test]]
name = "main"
path = "tests/main.rs"

[[bench]]
name = "index_bench"
path = "benches/index_bench.rs"
harness = false
required-features = ["vector-index"]

[[bench]]
name = "morsel_pipeline"
path = "benches/morsel_pipeline.rs"
harness = false
required-features = ["parallel"]

[[bench]]
name = "store_apply"
path = "benches/store_apply.rs"
harness = false

[[bench]]
name = "top_k"
path = "benches/top_k.rs"
harness = false

[dependencies.arcstr]
