[package]
name = "siafudb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SiafuDB core: embedded graph database with fragments, bound-parameter queries, change log, and native/browser profiles. Pre-release."
rust-version = "1.99"
readme = "README.md"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# `native` (default): file-backed persistence, full Grafeo profile.
# `browser`: wasm32-unknown-unknown profile; in-memory + snapshot persistence only.
default = ["native"]
# Both profiles turn on the engine's change data capture (`cdc`), which
# `SiafuDB::enable_change_capture` builds on; it records nothing until enabled.
native = ["grafeo/embedded", "grafeo/wal", "grafeo/cdc"]
browser = ["grafeo/browser", "grafeo/cdc"]

[dependencies]
grafeo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
web-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
