# Dependabot — Cargo + GitHub Actions.
#
# Org policy:
#   - Run weekly, every Monday at 06:00 Africa/Harare.
#   - One PR per ecosystem with all available updates bundled.
#   - `build:` Conventional Commits prefix so pr-title-lint accepts it.
#
# siafudb is a Rust workspace, so cargo + github-actions cover everything
# it ships. The docs site (nyuchi/docs) lives in its own repo and is not
# covered here.

version: 2
updates:
  - package-ecosystem: "github-actions"
    target-branch: "staging"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Harare"
    open-pull-requests-limit: 1
    reviewers:
      - "bryanfawcett"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      all:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "cargo"
    target-branch: "staging"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Harare"
    open-pull-requests-limit: 1
    reviewers:
      - "bryanfawcett"
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      all:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
