# Rust CI — fmt, clippy, nextest, build, doc.
#
# Calls the org's reusable Rust monorepo workflow. Every job runs with
# RUSTFLAGS="-D warnings" and RUSTDOCFLAGS="-D warnings"; clippy runs
# with --all-targets --all-features -- -D warnings.

name: CI / Rust

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: nyuchi/.github/.github/workflows/reusable-ci-rust-monorepo.yml@c2be05a22aeb6a98a80a9301f6b3e33bb88b20b0  # v0.2.0
    with:
      toolchain: stable
