  # Review by 2027-02-01.
  "RUSTSEC-2025-0141",
  # paste: "unmaintained" notice, no patched release exists; proc-macro only
  # (build time), pulled in by the engine's dependencies. Review by 2027-02-01.
  "RUSTSEC-2024-0436",
]
