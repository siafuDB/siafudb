[package]
name = "cdcprobe"
version = "0.0.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[dependencies]
wasm-bindgen = "=0.2.130"
grafeo = { version = "0.6", default-features = false, features = ["browser", "cdc", "cypher"] }
serde_json = "1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
[profile.release]
opt-level = "z"
lto = true
panic = "abort"
[workspace]
