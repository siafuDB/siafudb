[package]
name="pqprobe"
version="0.0.0"
edition="2024"
[dependencies]
ml-kem = "*"
ml-dsa = "*"
blake3 = { version = "1", features = ["pure"] }
sha3 = "*"
chacha20poly1305 = "*"
x25519-dalek = "*"
ed25519-dalek = "3"
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[workspace]
